name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q pulsevisual.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.3
      - run: gradle build
        working-directory: pulsevisual
      - uses: actions/upload-artifact@v4
        with:
          name: pulsevisual-jar
          path: pulsevisual/build/libs/pulsevisual-*[0-9].jar
